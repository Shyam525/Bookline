name: Bookline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/Bookline.slnx

      - name: Build Solution
        run: dotnet build backend/Bookline.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test backend/Bookline.slnx --configuration Release --no-build --verbosity normal
