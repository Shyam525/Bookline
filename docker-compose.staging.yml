services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bookline-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookline_staging}
      POSTGRES_USER: ${POSTGRES_USER:-bookline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required postgres password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookline_user} -d ${POSTGRES_DB:-bookline_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookline_staging_net

  redis:
    image: redis:7-alpine
    container_name: bookline-redis-staging
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Required redis password}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookline_staging_net

  bookline-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookline-api-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:5168
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookline_staging};Username=${POSTGRES_USER:-bookline_user};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Jwt__Key=${JWT_SECRET_KEY:?Required JWT signing key (min 64 chars)}
      - Jwt__Issuer=${JWT_ISSUER:-https://staging.bookline.in}
      - Jwt__Audience=${JWT_AUDIENCE:-https://staging.bookline.in}
      - ForwardedHeaders__TrustAllProxies=true
      - Notification__Provider=${NOTIFICATION_PROVIDER:-Console}
      - Notification__WhatsAppEnabled=${WHATSAPP_ENABLED:-false}
      - Notification__SmsEnabled=${SMS_ENABLED:-false}
      - DataProtection__KeyPath=/app/keys
    volumes:
      - dataprotection_keys:/app/keys
    networks:
      - bookline_staging_net

  nginx:
    image: nginx:alpine
    container_name: bookline-nginx-staging
    restart: unless-stopped
    depends_on:
      - bookline-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/letsencrypt:ro
    networks:
      - bookline_staging_net

volumes:
  postgres_staging_data:
  redis_staging_data:
  dataprotection_keys:
  certs_data:

networks:
  bookline_staging_net:
    driver: bridge

