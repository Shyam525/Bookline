services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bookline-postgres
    environment:
      POSTGRES_DB: bookline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: bookline-mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookline-api
    ports:
      - "5168:5168"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=bookline_db;Username=postgres;Password=postgrespassword
      - Redis__ConnectionString=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookline-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
